<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 620 420" width="620" height="420">
  <!-- ═══ DRAGÓN VOLANDO HACIA UN LADO ═══
       Cabeza de perfil mirando a la derecha, con el cuello y las alas atrás,
       como si cruzara el cuadro. Mismo lenguaje de sticker: borde blanco
       troquelado por debajo, contorno negro, relleno plano.
       Se puede voltear con ⇋ para que vuele hacia el otro lado. -->
  <defs>
    <filter id="ds" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <linearGradient id="piel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD98A"/>
      <stop offset="1" stop-color="#0E9E63"/>
    </linearGradient>
    <linearGradient id="ala" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FA86E"/>
      <stop offset="1" stop-color="#0A7C4C"/>
    </linearGradient>

    <!-- Silueta completa, para el troquelado blanco de una sola pasada -->
    <g id="dragonBody">
      <!-- ala trasera -->
      <path d="M 214 176 C 176 92 104 34 26 30 C 60 74 78 118 84 156
               C 62 130 34 116 8 118 C 44 152 62 190 68 224
               C 52 206 30 198 10 202 C 46 236 74 268 92 300
               C 132 258 176 214 214 176 Z"/>
      <!-- cuerpo / cuello -->
      <path d="M 150 250 C 120 300 138 356 196 372 C 250 386 316 364 350 322
               C 372 294 372 258 352 232 C 330 204 296 196 268 208
               C 250 216 240 234 244 252 C 216 240 178 226 150 250 Z"/>
      <!-- cabeza y hocico -->
      <path d="M 300 118 C 356 96 430 108 470 148 C 496 174 512 200 560 210
               C 520 232 480 232 452 220 C 448 244 430 264 402 272
               C 356 286 306 262 292 216 C 282 182 286 146 300 118 Z"/>
      <!-- cuernos -->
      <path d="M 344 116 C 334 76 348 40 384 18 C 372 58 376 92 396 116 Z"/>
      <path d="M 300 128 C 274 100 268 66 286 34 C 288 76 300 102 322 122 Z"/>
    </g>
  </defs>

  <g filter="url(#ds)">
    <!-- troquelado -->
    <use href="#dragonBody" fill="#fff" stroke="#fff" stroke-width="34" stroke-linejoin="round"/>

    <!-- ala -->
    <path d="M 214 176 C 176 92 104 34 26 30 C 60 74 78 118 84 156
             C 62 130 34 116 8 118 C 44 152 62 190 68 224
             C 52 206 30 198 10 202 C 46 236 74 268 92 300
             C 132 258 176 214 214 176 Z"
          fill="url(#ala)" stroke="#0A2A1C" stroke-width="9" stroke-linejoin="round"/>
    <!-- nervaduras del ala -->
    <g fill="none" stroke="#0A2A1C" stroke-width="6" stroke-linecap="round" opacity=".55">
      <path d="M 208 180 C 150 138 96 106 40 62"/>
      <path d="M 196 196 C 142 176 96 154 34 128"/>
      <path d="M 176 222 C 136 216 92 204 36 208"/>
    </g>
    <!-- cuerpo -->
    <path d="M 150 250 C 120 300 138 356 196 372 C 250 386 316 364 350 322
             C 372 294 372 258 352 232 C 330 204 296 196 268 208
             C 250 216 240 234 244 252 C 216 240 178 226 150 250 Z"
          fill="url(#piel)" stroke="#0A2A1C" stroke-width="9" stroke-linejoin="round"/>
    <!-- cuernos -->
    <path d="M 344 116 C 334 76 348 40 384 18 C 372 58 376 92 396 116 Z"
          fill="#E9D9A8" stroke="#0A2A1C" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 300 128 C 274 100 268 66 286 34 C 288 76 300 102 322 122 Z"
          fill="#E9D9A8" stroke="#0A2A1C" stroke-width="8" stroke-linejoin="round"/>
    <!-- cabeza -->
    <path d="M 300 118 C 356 96 430 108 470 148 C 496 174 512 200 560 210
             C 520 232 480 232 452 220 C 448 244 430 264 402 272
             C 356 286 306 262 292 216 C 282 182 286 146 300 118 Z"
          fill="url(#piel)" stroke="#0A2A1C" stroke-width="9" stroke-linejoin="round"/>
    <!-- ojo -->
    <ellipse cx="366" cy="176" rx="24" ry="19" fill="#fff" stroke="#0A2A1C" stroke-width="7"/>
    <ellipse cx="372" cy="176" rx="8" ry="16" fill="#0A2A1C"/>
    <!-- ceja -->
    <path d="M 336 148 C 356 138 384 140 398 152" fill="none" stroke="#0A2A1C" stroke-width="9" stroke-linecap="round"/>
    <!-- fosa nasal -->
    <ellipse cx="498" cy="196" rx="9" ry="6" fill="#0A2A1C"/>
    <!-- dientes -->
    <path d="M 452 220 l 16 20 l 12 -18 l 14 18 l 10 -20" fill="#fff" stroke="#0A2A1C" stroke-width="6" stroke-linejoin="round"/>
    <!-- cresta del cuello -->
    <g fill="#E9D9A8" stroke="#0A2A1C" stroke-width="7" stroke-linejoin="round">
      <path d="M 296 236 l -34 12 l 30 20 Z"/>
      <path d="M 274 284 l -38 6 l 30 26 Z"/>
      <path d="M 250 326 l -38 0 l 28 28 Z"/>
    </g>
  </g>
</svg>
