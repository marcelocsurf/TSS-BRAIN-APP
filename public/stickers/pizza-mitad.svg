<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 636 366" width="636" height="366">
  <!-- ═══ MEDIA PIZZA ═══
       Sticker tipo dibujo. Medio círculo = el arco de 180° de un giro.
       Mismo lenguaje que el resto: borde blanco troquelado por debajo,
       contorno negro del dibujo, y relleno plano con sombra. -->
  <defs>
    <filter id="ps" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <path id="half" d="M 10 300 A 290 290 0 0 1 590 300 Z"/>
  </defs>

  <g filter="url(#ps)">
    <!-- troquelado -->
    <use href="#half" fill="#fff" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
    <!-- corteza -->
    <use href="#half" fill="#E9A33C" stroke="#1A1206" stroke-width="9" stroke-linejoin="round"/>
    <!-- queso -->
    <path d="M 52 296 A 248 248 0 0 1 548 296 Z" fill="#FFCE47" stroke="#1A1206" stroke-width="7" stroke-linejoin="round"/>
    <!-- salsa asomando -->
    <path d="M 96 292 A 204 204 0 0 1 504 292 Z" fill="#FFD866" stroke="none"/>
    <!-- pepperoni -->
    <g stroke="#1A1206" stroke-width="6">
      <circle cx="176" cy="212" r="34" fill="#D8402F"/>
      <circle cx="300" cy="146" r="34" fill="#D8402F"/>
      <circle cx="424" cy="212" r="34" fill="#D8402F"/>
      <circle cx="238" cy="272" r="27" fill="#D8402F"/>
      <circle cx="362" cy="272" r="27" fill="#D8402F"/>
    </g>
    <!-- brillos del queso -->
    <g fill="#FFF0B8" opacity=".75">
      <ellipse cx="140" cy="268" rx="17" ry="9"/>
      <ellipse cx="300" cy="238" rx="20" ry="10"/>
      <ellipse cx="470" cy="266" rx="16" ry="8"/>
    </g>
  </g>
</svg>
