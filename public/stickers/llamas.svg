<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -14 932 330" width="932" height="330">
  <!-- ═══ LLAMAS A LO LARGO ═══
       Sticker tipo dibujo: una lengua de fuego horizontal para marcar el
       tramo caliente de la ola — la línea de velocidad, la sección de poder.
       Construcción: una silueta de llamas repetida en capas, de afuera hacia
       adentro (rojo → naranja → amarillo), con el contorno negro del dibujo y
       el borde blanco troquelado de sticker por debajo. -->
  <defs>
    <filter id="fs" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C81E1E"/>
      <stop offset=".45" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF6A1F"/>
      <stop offset="1" stop-color="#FFC531"/>
    </linearGradient>

    <!-- La silueta: seis lenguas de distinta altura sobre una base corrida. -->
    <path id="flame" d="
      M 24 268
      C 30 214 66 206 74 168 C 92 196 86 226 78 246 C 104 226 112 176 96 138
      C 140 160 152 214 140 252 C 168 232 174 176 156 130
      C 206 154 224 210 214 254 C 246 232 254 168 232 112
      C 296 146 318 214 306 258 C 340 232 348 160 322 96
      C 396 138 424 212 412 258 C 448 230 456 150 428 84
      C 508 130 540 210 528 258 C 566 228 574 142 544 74
      C 630 124 664 208 652 260 C 690 230 698 138 668 66
      C 758 120 792 208 780 262 C 812 240 822 176 806 128
      C 856 168 872 226 868 268 Z"/>
  </defs>

  <g filter="url(#fs)">
    <!-- Borde blanco troquelado: la misma silueta, trazo grueso, por debajo -->
    <use href="#flame" fill="#fff" stroke="#fff" stroke-width="26" stroke-linejoin="round"/>
    <!-- Contorno negro del dibujo -->
    <use href="#flame" fill="url(#hot)" stroke="#1A1206" stroke-width="9" stroke-linejoin="round"/>
    <!-- Capa media, encogida hacia el centro -->
    <g transform="translate(450 268) scale(.72 .66) translate(-450 -268)">
      <use href="#flame" fill="url(#mid)" stroke="#1A1206" stroke-width="10" stroke-linejoin="round"/>
    </g>
    <!-- Corazón amarillo -->
    <g transform="translate(450 268) scale(.42 .38) translate(-450 -268)">
      <use href="#flame" fill="#FFE86B" stroke="#1A1206" stroke-width="16" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
