# Backup semanal de TSS BRAIN (base + archivos) fuera de Supabase.
# Corre los domingos 06:00 UTC (00:00 El Salvador) y a mano desde la pestaña
# Actions → "Backup semanal" → Run workflow.
#
# Secretos que tienen que existir en GitHub → Settings → Secrets → Actions:
#   NEXT_PUBLIC_SUPABASE_URL     (obligatorio)
#   SUPABASE_SERVICE_ROLE_KEY    (obligatorio)
#   SUPABASE_DB_URL              (opcional: agrega un pg_dump real)
#   BACKUP_PASSPHRASE            (OBLIGATORIO desde 2026-10-01: sin ella el run falla
#                                 y no se sube nada — el respaldo trae datos de salud
#                                 y documentos de identidad; nunca sin cifrar)
#
# El resultado queda como "artifact" del run, 90 días (máximo de GitHub).
# Para restaurar: ver RECUPERACION.md.

name: Backup semanal

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Sin cifrado no hay respaldo (2026-10-01): antes se subía el paquete
      # en claro si faltaba la passphrase.
      - name: Exigir cifrado
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Falta el secreto BACKUP_PASSPHRASE. No se respalda sin cifrar."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Volcar base + storage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/backup.mjs ./backup-out

      - name: Empaquetar y cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          tar -czf "tss-backup-$STAMP.tar.gz" -C backup-out .
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "tss-backup-$STAMP.tar.gz" -out "tss-backup-$STAMP.tar.gz.enc" -pass env:BACKUP_PASSPHRASE
          rm "tss-backup-$STAMP.tar.gz"
          rm -rf backup-out
          # Solo el tamaño en el log: los logs se pueden leer desde afuera.
          ls -la tss-backup-*

      - uses: actions/upload-artifact@v4
        with:
          name: tss-backup-${{ github.run_id }}
          path: tss-backup-*.enc
          retention-days: 90
          if-no-files-found: error
